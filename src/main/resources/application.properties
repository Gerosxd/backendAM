# Nombre del Servicio
spring.application.name=AeroTaller-Backend

# --- CONFIGURACIÓN DE BASE DE DATOS ---
# Esto crea la DB 'aerotaller_db' automáticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/aerotaller_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# TU USUARIO DE MYSQL (Cámbialo si no es root)
spring.datasource.username=root
# TU CONTRASEÑA DE MYSQL (Cámbialo si tienes contraseña)
spring.datasource.password=root

# --- CONFIGURACIÓN JPA (Hibernate) ---
# Actualiza las tablas automáticamente según tus entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN SWAGGER ---
springdoc.swagger-ui.path=/swagger-ui.html